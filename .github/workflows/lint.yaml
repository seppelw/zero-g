name: Lint & Validate Add-on

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    name: Validate Add-on YAML & Shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate YAML files
        run: |
          python -c "import yaml; yaml.safe_load(open('repository.yaml'))"
          python -c "import yaml; yaml.safe_load(open('antigravity/config.yaml'))"
          python -c "import yaml; yaml.safe_load(open('antigravity/build.yaml'))"

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: 'antigravity/rootfs/usr/bin'

      - name: Run MCP Setup Unit Tests
        run: |
          python3 -m unittest discover -s tests -p "test_*.py" -v

