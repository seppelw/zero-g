name: Lint & Validate Add-on

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate:
    name: Validate Add-on YAML & Shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate YAML files
        run: |
          python -c "import yaml; yaml.safe_load(open('repository.yaml'))"
          python -c "import yaml; yaml.safe_load(open('zero-g/config.yaml'))"
          python -c "import yaml; yaml.safe_load(open('zero-g/build.yaml'))"
          python -c "import yaml; yaml.safe_load(open('zero-g/translations/en.yaml'))"
          python -c "import yaml; yaml.safe_load(open('zero-g/translations/de.yaml'))"

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: 'zero-g/rootfs/usr/bin'

      - name: Run MCP Setup Unit Tests
        run: |
          python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate Nginx Config
        run: |
          sudo apt-get update && sudo apt-get install -y nginx
          NGINX_TEST_TMP=$(mktemp --suffix=.conf)
          printf "pid /tmp/nginx_test.pid;\nevents { worker_connections 1024; }\nhttp {\n    include %s;\n}\n" "$PWD/zero-g/rootfs/etc/nginx/servers/ingress.conf" > "$NGINX_TEST_TMP"
          sudo nginx -t -c "$NGINX_TEST_TMP"
          rm -f "$NGINX_TEST_TMP"
