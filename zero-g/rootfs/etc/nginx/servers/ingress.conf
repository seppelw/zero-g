server {
    listen 8099 default_server;
    server_name _;

    # ── Onboarding static files ──────────────────────────────────────────────
    root /var/www/onboarding;

    location /onboarding/ {
        alias /var/www/onboarding/;
        try_files $uri $uri/ /onboarding/index.html;
    }

    # ── Zero-G Dashboard (Static UI) ─────────────────────────────────────────
    root /var/www/onboarding;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Health-check endpoint for Dashboard polling ──────────────────────────
    # Returns 200 when the upstream is alive, 502 otherwise.
    location = /_health {
        proxy_pass http://127.0.0.1:4400/;
        proxy_connect_timeout 2s;
        proxy_read_timeout    2s;
        # We don't intercept errors here because we just want the raw status code
    }
}
