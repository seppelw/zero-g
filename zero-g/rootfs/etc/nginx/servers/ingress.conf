server {
    listen 8099 default_server;
    server_name _;

    # ── Onboarding static files ──────────────────────────────────────────────
    root /var/www/onboarding;

    location /onboarding/ {
        alias /var/www/onboarding/;
        try_files $uri $uri/ /onboarding/index.html;
    }

    # Fallback when Antigravity daemon is not yet reachable
    location @onboarding {
        root /var/www/onboarding;
        try_files /index.html =502;
    }

    # ── Health-check endpoint for onboarding JS polling ──────────────────────
    # Returns 200 when the upstream is alive, 502 otherwise.
    location = /_health {
        proxy_pass http://127.0.0.1:4400/;
        proxy_connect_timeout 2s;
        proxy_read_timeout    2s;
        proxy_intercept_errors on;
        error_page 502 503 504 =502 /onboarding/index.html;
    }

    # ── Main Ingress Proxy ───────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:4400;

        # --- HTML path rewriting for Home Assistant Ingress ---
        # HA Ingress accesses the add-on via /api/hassio_ingress/<token>/
        # The upstream (agy) serves assets at absolute root paths like
        # /main.js, /jetbox.css. We must rewrite these to include the
        # Ingress prefix so the browser loads them through HA's proxy.
        #
        # Disable upstream compression so sub_filter can inspect the body.
        proxy_set_header Accept-Encoding "";

        sub_filter_types text/html text/css application/javascript;
        sub_filter_once off;

        # Rewrite double-quoted HTML attributes (href="/...", src="/...")
        sub_filter 'href="/'  'href="$http_x_ingress_path/';
        sub_filter 'src="/'   'src="$http_x_ingress_path/';
        sub_filter 'action="/' 'action="$http_x_ingress_path/';

        # Rewrite single-quoted HTML attributes (some bundlers emit these)
        sub_filter "href='/"  "href='$http_x_ingress_path/";
        sub_filter "src='/"   "src='$http_x_ingress_path/";

        # --- Standard proxy headers ---
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Ingress-Path    $http_x_ingress_path;

        # --- WebSocket upgrade for live agent/terminal streaming ---
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # --- Timeouts for long-lived streaming / SSE connections ---
        proxy_connect_timeout 5s;
        proxy_send_timeout    86400s;
        proxy_read_timeout    86400s;

        # --- Graceful fallback while daemon boots ---
        proxy_intercept_errors on;
        error_page 502 503 504 = @onboarding;
    }
}
