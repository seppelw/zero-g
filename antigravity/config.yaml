name: "Antigravity"
slug: "antigravity"
version: "1.0.0"
description: "Google Antigravity autonomous AI development environment & Web Interface with Home Assistant MCP integration"
url: "https://github.com/dinkelhause/homeassistant-antigravity"
arch:
  - amd64
  - aarch64
startup: "services"
boot: "auto"
init: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:robot-excited"
panel_title: "Antigravity"
homeassistant_api: true
hassio_role: "default"
map:
  - config:rw
  - share:rw
  - addons:rw
  - ssl:ro
options:
  auto_update: true
  remote_control_name: "homeassistant-antigravity"
  ha_mcp_enabled: true
  ha_mcp_mode: "auto"
  ha_mcp_url: ""
  ha_mcp_token: ""
  ha_mcp_history_enabled: false
  ha_mcp_history_url: ""
  auth_token: ""
  log_level: "info"
schema:
  auto_update: "bool"
  remote_control_name: "str"
  ha_mcp_enabled: "bool"
  ha_mcp_mode: "list(auto|manual)"
  ha_mcp_url: "url?"
  ha_mcp_token: "password?"
  ha_mcp_history_enabled: "bool"
  ha_mcp_history_url: "url?"
  auth_token: "password?"
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"

