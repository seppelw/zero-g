server {
    listen 8099 default_server;
    server_name _;

    root /var/www/onboarding;

    # Static assets for the Onboarding UI
    location /onboarding-static/ {
        alias /var/www/onboarding/;
        try_files $uri $uri/ =404;
    }

    # Direct access to the Onboarding UI
    location = /onboarding {
        try_files /index.html =404;
    }

    # Fallback to Onboarding UI if Antigravity daemon is booting or authenticating
    location @onboarding {
        rewrite ^.*$ /onboarding-static/index.html last;
    }

    # Main Ingress Proxy to Antigravity Remote Control Web Interface
    location / {
        proxy_pass http://127.0.0.1:4400;

        # Disable upstream compression so sub_filter can rewrite HTML paths
        proxy_set_header Accept-Encoding "";

        # Rewrite absolute root paths to respect Home Assistant Ingress prefix
        sub_filter_types text/html;
        sub_filter '<head>' '<head><base href="$http_x_ingress_path/">';
        sub_filter 'href="/' 'href="$http_x_ingress_path/';
        sub_filter 'src="/' 'src="$http_x_ingress_path/';
        sub_filter 'action="/' 'action="$http_x_ingress_path/';
        sub_filter_once off;

        # Standard Proxy Headers
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Ingress-Path $http_x_ingress_path;

        # WebSocket support for live agent interaction and terminal streaming
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long timeouts for streaming agent responses and SSE
        proxy_connect_timeout 5s;
        proxy_send_timeout 86400s;
        proxy_read_timeout 86400s;

        # Handle offline/booting daemon gracefully with onboarding screen
        proxy_intercept_errors on;
        error_page 502 503 504 = @onboarding;
    }
}
